experiment:
  name: recp
  seed: 0
  deterministic: true

data:
  image_size: [256, 256]
  in_channels: 1
  num_classes: 2
  class_names: [non_tumor, tumor]
  labeled_ratio: 0.10

model:
  backbone: unet2d
  base_channels: 16

training:
  epochs: 300
  warmup_epochs: 15
  batch_size: 32
  optimizer: adamw
  learning_rate: 0.0002
  weight_decay: 0.0001
  ema_decay: 0.99
  validation_model: teacher
  gradient_clip_norm: null
  checkpoint_interval: 1
  output_dir: runs/recp

method:
  text_encoder: clip_vit_b32
  freeze_text_encoder: true
  prompt_pairs: 3
  lambda_ugt_max: 1.0
  lambda_bfcl_max: 0.3
  gate_gamma: 0.5
  text_temperature: 0.07
  confidence_threshold: 0.7
